{{ define "main" }}
<div class="home">
    {{ .Content }}

    <h2>Recent Writing</h2>
    <ul>
        {{ range first 8 (where .Site.RegularPages "Type" "in" (slice "posts" "thoughts")).ByDate.Reverse }}
        <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ if .Date }}
            <span class="date"> - {{ .Date.Format "2006-01-02" }}</span>
            {{ end }}
        </li>
        {{ end }}
    </ul>
</div>
{{ end }}
